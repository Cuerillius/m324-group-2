name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# A newer push to a pull request makes the older run pointless. On main the run
# may be deploying, and a deploy must never be cancelled halfway.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Lint, typecheck and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: m324
        options: >-
          --health-cmd "pg_isready -U postgres -d m324"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test:coverage

      - name: Create database roles
        run: bash db/init/01-init.sh
        env:
          PGHOST: localhost
          PGPASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: m324
          LOCATIONS_DB_PASSWORD: locations
          PROPERTIES_DB_PASSWORD: properties

      # In production each service's first migration creates its schema as its
      # own role. Properties has a migration, locations not yet, so create the
      # locations schema here by hand.
      - name: Create the locations schema as its own role
        run: psql postgres://locations_user:locations@localhost:5432/m324 -c 'CREATE SCHEMA locations'

      - name: Integration tests — locations
        working-directory: services/locations
        run: bun run test:integration
        env:
          INTEGRATION: 1
          DATABASE_URL: postgres://locations_user:locations@localhost:5432/m324

      - name: Integration tests — properties
        working-directory: services/properties
        run: bun run test:integration
        env:
          INTEGRATION: 1
          DATABASE_URL: postgres://properties_user:properties@localhost:5432/m324

  docker:
    name: Build service images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [locations, properties]
    steps:
      - uses: actions/checkout@v7

      - name: Build ${{ matrix.service }} image
        run: docker build -f services/${{ matrix.service }}/Dockerfile -t m324-${{ matrix.service }}:ci .

  deploy:
    name: Deploy
    needs: [verify, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    with:
      commit: ${{ github.sha }}
    secrets: inherit

  publish:
    name: Publish service images
    runs-on: ubuntu-latest
    needs: [verify, docker]
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    strategy:
      matrix:
        service: [locations, properties]
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/cuerillius/m324-group-2/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        env:
          VERSION: ${{ github.ref_name }}
          SHA_TAG: sha-${{ github.sha }}
        run: |
          docker build -f services/${{ matrix.service }}/Dockerfile \
            --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }} \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            --label org.opencontainers.image.version=$VERSION \
            -t $IMAGE:$VERSION -t $IMAGE:$SHA_TAG -t $IMAGE:latest .
          for tag in $VERSION $SHA_TAG latest; do docker push $IMAGE:$tag; done
          DIGEST=$(docker inspect --format '{{index .RepoDigests 0}}' $IMAGE:$VERSION)
          echo "Published $IMAGE:$VERSION ($SHA_TAG, latest)"
          echo "Digest: $DIGEST"
          {
            echo "### ${{ matrix.service }}"
            echo "- \`$IMAGE:$VERSION\`"
            echo "- \`$IMAGE:$SHA_TAG\`"
            echo "- \`$IMAGE:latest\`"
            echo "- Digest: \`$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
