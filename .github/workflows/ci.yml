name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request makes the older run pointless. On main the run
# may be deploying, and a deploy must never be cancelled halfway.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Lint, typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test:coverage

  docker:
    name: Build service images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [locations, properties]
    steps:
      - uses: actions/checkout@v7

      - name: Build ${{ matrix.service }} image
        run: docker build -f services/${{ matrix.service }}/Dockerfile -t m324-${{ matrix.service }}:ci .

  deploy:
    name: Deploy
    needs: [verify, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    with:
      commit: ${{ github.sha }}
    secrets: inherit
